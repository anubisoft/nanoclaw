name: Deploy

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "container/**"
      - "package*.json"
      - "pnpm-lock.yaml"
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: CI & Deploy
    runs-on: [self-hosted, linux, production]
    environment: production
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm run format:check

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Tests
        run: pnpm test

      - name: Deploy NanoClaw
        run: ./scripts/deploy.sh

      - name: Show logs on failure
        if: failure()
        run: |
          docker logs nanoclaw --tail=80 2>/dev/null || true
          MH="${MULTIHOST_ROOT:-/home/deploy/platform-ops/multihost}"
          if [[ -f "$MH/scripts/compose-factory.sh" ]]; then
            (cd "$MH" && APPS=nanoclaw bash scripts/compose-factory.sh logs --tail=80 nanoclaw) || true
          fi
